<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hrací kostka – Aero</title>
<style>
    :root {
        --navy: #00477F;
        --blue: #1a7fd0;
        --sky: #4db3ff;
        --ice: #bfe6ff;
        --foam: #eaf7ff;
    }
    * { box-sizing: border-box; }

    /* ===== Pozadí: nebe v Aero stylu se světelnými paprsky a bublinami ===== */
    body {
        margin: 0; min-height: 100vh;
        font-family: "Segoe UI", Tahoma, Verdana, sans-serif;
        color: #0b2a47;
        display: flex; align-items: center; justify-content: center;
        padding: 20px;
        overflow-x: hidden;
        background:
            radial-gradient(ellipse at 15% 0%, rgba(160,215,255,.4), transparent 45%),
            radial-gradient(ellipse at 90% 100%, rgba(26,127,208,.5), transparent 50%),
            linear-gradient(160deg, #3f8fcf 0%, #0d5a9c 38%, #00335c 75%, #001f3a 100%);
        background-attachment: fixed;
    }
    body::before {            /* světelné paprsky */
        content: ""; position: fixed; inset: -20%;
        background: conic-gradient(from 200deg at 10% -10%,
            transparent 0 8%, rgba(255,255,255,.18) 10%, transparent 14%,
            rgba(255,255,255,.12) 18%, transparent 22%,
            rgba(255,255,255,.16) 27%, transparent 33%);
        animation: paprsky 18s ease-in-out infinite alternate;
        pointer-events: none;
    }
    @keyframes paprsky { from { transform: rotate(-4deg); } to { transform: rotate(5deg); } }

    .bublina {
        position: fixed; bottom: -120px; border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.9), rgba(255,255,255,.15) 45%, rgba(255,255,255,.05));
        border: 1px solid rgba(255,255,255,.5);
        animation: pluje linear infinite;
        pointer-events: none;
    }
    @keyframes pluje { to { transform: translateY(-120vh) translateX(30px); } }

    /* ===== Aero okno ===== */
    .okno {
        position: relative; width: min(96vw, 860px);
        border-radius: 12px;
        background: linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,.18) 40%, rgba(0,71,127,.25));
        border: 1px solid rgba(255,255,255,.8);
        box-shadow: 0 0 0 1px rgba(0,50,90,.55), 0 25px 60px rgba(0,30,60,.55), inset 0 1px 0 rgba(255,255,255,.9);
        backdrop-filter: blur(14px) saturate(1.4);
        padding: 0 8px 8px;
    }
    .titulek {
        display: flex; align-items: center; justify-content: space-between;
        height: 38px; padding: 0 4px 0 10px;
        color: #04213a; font-size: 14px; text-shadow: 0 0 10px #fff, 0 0 4px #fff;
    }
    .titulek .nazev { display: flex; align-items: center; gap: 8px; font-weight: 600; }
    .ikonka {
        width: 18px; height: 18px; border-radius: 4px;
        background: linear-gradient(135deg, #fff, var(--sky) 60%, var(--navy));
        box-shadow: 0 0 0 1px rgba(0,50,90,.6);
    }
    .ovladani { display: flex; gap: 2px; }
    .ovladani span {
        width: 30px; height: 20px; border-radius: 0 0 4px 4px;
        border: 1px solid rgba(0,50,90,.55);
        background: linear-gradient(180deg, rgba(255,255,255,.8) 0 48%, rgba(120,190,240,.7) 50%);
    }
    .ovladani span:last-child {
        width: 46px; color: #fff; text-shadow: none; font-size: 12px; text-align: center; line-height: 18px;
        background: linear-gradient(180deg, #f6a08c 0 48%, #c8321b 50%, #e2573d);
    }

    .telo {
        display: grid; grid-template-columns: 1.25fr 1fr; gap: 8px;
        background: linear-gradient(180deg, var(--foam), #fff);
        border: 1px solid rgba(0,50,90,.5);
        border-radius: 4px; padding: 8px;
    }
    @media (max-width: 680px) { .telo { grid-template-columns: 1fr; } }

    /* ===== Levý panel: scéna s lesklou podlahou ===== */
    .scena {
        border-radius: 6px; padding: 18px 14px 20px;
        text-align: center; position: relative; overflow: hidden;
        background: linear-gradient(180deg, #d9f0ff 0%, #8ccbf5 55%, #3d9be0 56%, #176bb3 100%);
        border: 1px solid #5da7dc;
        box-shadow: inset 0 0 30px rgba(255,255,255,.6);
    }
    .scena h1 {
        margin: 0 0 12px; font-size: 26px; font-weight: 300; color: var(--navy);
        text-shadow: 0 1px 0 #fff, 0 0 12px rgba(255,255,255,.9);
    }

    .segment { display: inline-flex; border-radius: 6px; overflow: hidden; border: 1px solid #2a6ea5; box-shadow: 0 1px 3px rgba(0,40,80,.3); }
    .segment button {
        border: none; border-right: 1px solid #2a6ea5; padding: 6px 14px;
        font: 13px "Segoe UI", sans-serif; color: #0b2a47; cursor: pointer;
        background: linear-gradient(180deg, #fff 0 50%, #cfe9fb 51%);
    }
    .segment button:last-child { border-right: none; }
    .segment button.aktivni {
        color: #fff; text-shadow: 0 -1px 0 rgba(0,0,0,.4);
        background: linear-gradient(180deg, #4aa3ec 0 50%, var(--navy) 51%, #0a5ea3);
        box-shadow: inset 0 2px 5px rgba(0,0,0,.35);
    }

    .stul {
        display: flex; flex-wrap: wrap; justify-content: center; gap: 22px;
        min-height: 140px; margin: 18px 0 4px;
    }

    /* ===== Skutečná 3D skleněná kostka ===== */
    .misto { position: relative; width: 92px; height: 130px; perspective: 650px; }
    .skok, .nakl, .kostka { transform-style: preserve-3d; }
    .skok { position: absolute; left: 0; top: 4px; width: 92px; height: 92px; }
    .nakl { width: 92px; height: 92px; transform: rotateX(-20deg) rotateY(-26deg); }
    .kostka {
        position: relative; width: 92px; height: 92px;
        transition: transform 1.1s cubic-bezier(.15,.75,.25,1);
    }
    .strana {
        position: absolute; inset: 0; border-radius: 12px;
        display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
        padding: 14px; overflow: hidden;
        background: linear-gradient(145deg, #8ad6ff 0%, var(--blue) 50%, var(--navy) 100%);
        border: 1px solid rgba(255,255,255,.85);
        box-shadow: inset 0 0 16px rgba(255,255,255,.45), inset 0 -8px 14px rgba(0,30,70,.5);
        backface-visibility: hidden;
    }
    .strana::before {            /* lesklý odlesk */
        content: ""; position: absolute; left: 0; right: 0; top: 0; height: 48%;
        background: linear-gradient(180deg, rgba(255,255,255,.65), rgba(255,255,255,.05));
        pointer-events: none;
    }
    /* Pozice stran: protilehlé strany dávají součet 7 */
    .s1 { transform: translateZ(46px); }
    .s6 { transform: rotateY(180deg) translateZ(46px); filter: brightness(.8); }
    .s2 { transform: rotateY(90deg) translateZ(46px);  filter: brightness(.88); }
    .s5 { transform: rotateY(-90deg) translateZ(46px); filter: brightness(.95); }
    .s3 { transform: rotateX(90deg) translateZ(46px);  filter: brightness(1.2); }
    .s4 { transform: rotateX(-90deg) translateZ(46px); filter: brightness(.7); }
    .tecka {
        width: 17px; height: 17px; border-radius: 50%; place-self: center; z-index: 1;
        background: radial-gradient(circle at 35% 30%, #fff, var(--ice) 60%, #8cc8f0);
        box-shadow: 0 0 8px rgba(255,255,255,.9), 0 1px 2px rgba(0,30,70,.6);
    }
    /* Stín na podlaze */
    .stin {
        position: absolute; left: 6px; right: 6px; bottom: 6px; height: 20px; border-radius: 50%;
        background: radial-gradient(ellipse, rgba(0,25,60,.65), transparent 70%);
    }
    .misto.hazi .skok { animation: skok var(--doba, 1.1s) ease-in-out; }
    .misto.hazi .stin { animation: stin var(--doba, 1.1s) ease-in-out; }
    @keyframes skok {
        0%   { transform: translateY(0); }
        30%  { transform: translateY(-85px) scale(1.12); }
        60%  { transform: translateY(0) scale(1); }
        78%  { transform: translateY(-16px); }
        100% { transform: translateY(0); }
    }
    @keyframes stin {
        0%, 60%, 100% { transform: scale(1); opacity: 1; }
        30% { transform: scale(.55); opacity: .45; }
        78% { transform: scale(.85); opacity: .8; }
    }

    .soucet { min-height: 30px; font-size: 22px; font-weight: 600; color: #fff; text-shadow: 0 1px 4px rgba(0,30,70,.8); margin-bottom: 8px; }

    /* Lesklé Aero tlačítko */
    #hod {
        position: relative; border: 1px solid #013a69; border-radius: 999px;
        padding: 12px 38px; font: 600 18px "Segoe UI", sans-serif; color: #fff;
        text-shadow: 0 -1px 0 rgba(0,0,0,.5); cursor: pointer; overflow: hidden;
        background: linear-gradient(180deg, #5db9ff 0 50%, var(--navy) 51%, #1e86d8);
        box-shadow: 0 4px 10px rgba(0,30,70,.55), inset 0 1px 0 rgba(255,255,255,.8), inset 0 0 12px rgba(120,210,255,.6);
        transition: filter .2s, transform .1s;
    }
    #hod::after {
        content: ""; position: absolute; left: 6%; right: 6%; top: 2px; height: 44%;
        border-radius: 999px; background: linear-gradient(180deg, rgba(255,255,255,.7), rgba(255,255,255,.05));
    }
    #hod:hover { filter: brightness(1.15) saturate(1.2); }
    #hod:active { transform: translateY(1px); }
    #hod:disabled { filter: grayscale(.4); cursor: wait; }

    .tlacitka { display: flex; align-items: center; justify-content: center; gap: 12px; }
    #auto {
        position: relative; overflow: hidden; border: 1px solid #013a69; border-radius: 999px;
        padding: 9px 20px; font: 600 15px "Segoe UI", sans-serif; color: #fff;
        text-shadow: 0 -1px 0 rgba(0,0,0,.5); cursor: pointer;
        background: linear-gradient(180deg, #3f8fcf 0 50%, #00335c 51%, #1a6fb0);
        box-shadow: 0 4px 10px rgba(0,30,70,.55), inset 0 1px 0 rgba(255,255,255,.6), inset 0 0 10px rgba(120,210,255,.3);
        transition: filter .2s, transform .1s, box-shadow .2s;
    }
    #auto::after {               /* stejný lesklý odlesk jako u tlačítka Hodit */
        content: ""; position: absolute; left: 6%; right: 6%; top: 2px; height: 44%;
        border-radius: 999px; background: linear-gradient(180deg, rgba(255,255,255,.6), rgba(255,255,255,.05));
        pointer-events: none;
    }
    #auto:hover { filter: brightness(1.15) saturate(1.2); }
    #auto:active { transform: translateY(1px); }
    #auto .ic { display: inline-block; margin-right: 6px; }
    #auto.zap {                  /* zapnuto: světlejší, svítící sklo */
        background: linear-gradient(180deg, #9be0ff 0 50%, #1a8fe6 51%, #4cc4ff);
        box-shadow: 0 0 14px rgba(120,215,255,.95), 0 4px 10px rgba(0,30,70,.55), inset 0 1px 0 #fff, inset 0 0 14px rgba(255,255,255,.7);
    }
    #auto.zap .ic { animation: toc 1.6s linear infinite; }
    @keyframes toc { to { transform: rotate(360deg); } }

    /* ===== Pravý panel: panely Hody a Statistika ===== */
    .boky { display: flex; flex-direction: column; gap: 8px; }
    .panel {
        border: 1px solid #9cc7e8; border-radius: 6px; overflow: hidden;
        background: #fff; flex: 1;
    }
    .panel h2 {
        margin: 0; padding: 7px 12px; font-size: 14px; font-weight: 600; color: var(--navy);
        background: linear-gradient(180deg, #fff 0 50%, #dcefff 51%);
        border-bottom: 1px solid #b6d6ef;
    }
    #seznam { list-style: none; margin: 0; padding: 0; max-height: 170px; overflow-y: auto; }
    #seznam li {
        display: flex; justify-content: space-between; padding: 6px 12px; font-size: 14px;
        border-bottom: 1px solid #e6f1fa;
    }
    #seznam li:nth-child(odd) { background: #f3faff; }
    #seznam li:first-child { background: #d8eeff; font-weight: 600; }
    #seznam .prazdno { color: #6b8aa5; display: block; padding: 10px 12px; }

    .graf { display: flex; align-items: flex-end; gap: 8px; height: 110px; padding: 10px 12px 8px; }
    .sloupec { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
    .pruh {
        width: 100%; min-height: 3px; border-radius: 4px 4px 0 0; border: 1px solid #0a5ea3;
        background: linear-gradient(90deg, var(--navy), var(--sky) 45%, var(--navy));
        transition: height .4s;
    }
    .pocet { font-size: 12px; color: var(--navy); margin-bottom: 2px; }
    .cislo { font-size: 13px; margin-top: 3px; color: #36597a; }

    .reset {
        margin: 0 12px 10px; padding: 4px 12px; font: 12px "Segoe UI", sans-serif; color: #0b2a47;
        border: 1px solid #2a6ea5; border-radius: 4px; cursor: pointer;
        background: linear-gradient(180deg, #fff 0 50%, #cfe9fb 51%);
    }
    .reset:hover { background: linear-gradient(180deg, #fff 0 50%, #b6dcf8 51%); }

    @media (prefers-reduced-motion: reduce) { body::before, .bublina, .misto.hazi .skok, .misto.hazi .stin, #auto.zap .ic { animation: none; } .kostka { transition: none; } }
</style>
</head>
<body>

<div class="okno">
    <div class="titulek">
        <div class="nazev"><span class="ikonka"></span>Hrací kostka</div>
        <div class="ovladani"><span></span><span></span><span>✕</span></div>
    </div>

    <div class="telo">
        <section class="scena">
            <h1>Hoď kostkou</h1>
            <div class="segment" id="volba">
                <button data-pocet="1" class="aktivni">1 kostka</button>
                <button data-pocet="2">2 kostky</button>
                <button data-pocet="3">3 kostky</button>
            </div>
            <div class="stul" id="stul"></div>
            <div class="soucet" id="soucet"></div>
            <div class="tlacitka">
                <button id="hod">Hodit</button>
                <button id="auto" title="Kostka se sama točí, zastaví se a po chvíli se roztočí znovu"><span class="ic">⟳</span><span id="autoText">Auto: vypnuto</span></button>
            </div>
        </section>

        <aside class="boky">
            <div class="panel">
                <h2>Poslední hody</h2>
                <ul id="seznam"></ul>
            </div>
            <div class="panel">
                <h2>Statistika</h2>
                <div class="graf" id="graf"></div>
                <button class="reset" id="reset">Vymazat</button>
            </div>
        </aside>
    </div>
</div>

<script>
    // Bubliny na pozadí
    for (let i = 0; i < 14; i++) {
        const b = document.createElement("div");
        const s = 20 + Math.random() * 70;
        b.className = "bublina";
        b.style.cssText = `width:${s}px;height:${s}px;left:${Math.random() * 100}vw;` +
            `animation-duration:${14 + Math.random() * 16}s;animation-delay:${-Math.random() * 20}s`;
        document.body.appendChild(b);
    }

    // Rozložení teček (pozice v mřížce 3x3)
    const TECKY = { 1: [5], 2: [1, 9], 3: [1, 5, 9], 4: [1, 3, 7, 9], 5: [1, 3, 5, 7, 9], 6: [1, 3, 4, 6, 7, 9] };

    let pocetKostek = 1;
    let historie = [];
    let statistika = [0, 0, 0, 0, 0, 0];

    const stul = document.getElementById("stul");
    const soucetEl = document.getElementById("soucet");
    const tlacitko = document.getElementById("hod");
    const autoBtn = document.getElementById("auto");
    const PAUZA = 2200;      // ms, po které je vidět výsledek, než se kostka roztočí znovu
    let autoZapnuto = false;
    let autoCasovac = null;

    // Natočení kostky (X, Y), aby nahoře/vpředu byla požadovaná strana
    const OTOCENI = { 1: [0, 0], 6: [0, 180], 2: [0, -90], 5: [0, 90], 3: [-90, 0], 4: [90, 0] };
    let kolo = 0; // kolikrát se už házelo – natočení roste, takže se kostka vždy otočí dopředu

    function vytvorKostku(hodnota) {
        const misto = document.createElement("div");
        misto.className = "misto";
        let strany = "";
        for (let n = 1; n <= 6; n++) {
            strany += `<div class="strana s${n}">` +
                TECKY[n].map(p => `<span class="tecka" style="grid-area:${Math.ceil(p / 3)} / ${((p - 1) % 3) + 1}"></span>`).join("") +
                `</div>`;
        }
        misto.innerHTML = `<div class="stin"></div><div class="skok"><div class="nakl"><div class="kostka">${strany}</div></div></div>`;
        natoc(misto, hodnota || 5);
        return misto;
    }

    function natoc(misto, hodnota) {
        const [x, y] = OTOCENI[hodnota];
        misto.querySelector(".kostka").style.transform = `rotateX(${x + 720 * kolo}deg) rotateY(${y + 1080 * kolo}deg)`;
    }

    function zobrazKostky(hodnoty) {
        stul.innerHTML = "";
        hodnoty.forEach(h => stul.appendChild(vytvorKostku(h)));
    }

    function hodKostkou() {
        clearTimeout(autoCasovac);
        tlacitko.disabled = true;
        const hodnoty = Array.from({ length: pocetKostek }, () => Math.floor(Math.random() * 6) + 1);
        kolo++;

        const mista = [...stul.children];
        mista.forEach((m, i) => {
            m.style.setProperty("--doba", (1.1 + i * 0.12) + "s");
            m.querySelector(".kostka").style.transitionDuration = (1.1 + i * 0.12) + "s";
            m.classList.remove("hazi");
            void m.offsetWidth;          // restart animace skoku
            m.classList.add("hazi");
            natoc(m, hodnoty[i]);
        });

        setTimeout(() => {
            mista.forEach(m => m.classList.remove("hazi"));
            const soucet = hodnoty.reduce((a, b) => a + b, 0);
            soucetEl.textContent = pocetKostek > 1 ? `Součet: ${soucet}` : "";
            hodnoty.forEach(h => statistika[h - 1]++);
            historie.unshift(pocetKostek > 1 ? [hodnoty.join(" + "), soucet] : [hodnoty[0], ""]);
            historie = historie.slice(0, 10);
            vykresli();
            tlacitko.disabled = false;
            if (autoZapnuto) autoCasovac = setTimeout(hodKostkou, PAUZA);
        }, 1100 + (pocetKostek - 1) * 120 + 100);
    }

    function vykresli() {
        document.getElementById("seznam").innerHTML = historie.length
            ? historie.map(([a, b]) => `<li><span>${a}</span><span>${b !== "" ? "= " + b : ""}</span></li>`).join("")
            : '<li class="prazdno">Zatím jsi nehodil. Klikni na Hodit.</li>';

        const max = Math.max(...statistika, 1);
        document.getElementById("graf").innerHTML = statistika.map((n, i) => `
            <div class="sloupec">
                <span class="pocet">${n}</span>
                <div class="pruh" style="height:${(n / max) * 70}px"></div>
                <span class="cislo">${i + 1}</span>
            </div>`).join("");
    }

    document.getElementById("volba").addEventListener("click", e => {
        const b = e.target.closest("button");
        if (!b) return;
        pocetKostek = Number(b.dataset.pocet);
        document.querySelectorAll("#volba button").forEach(x => x.classList.toggle("aktivni", x === b));
        soucetEl.textContent = "";
        zobrazKostky(new Array(pocetKostek).fill(0));
    });

    document.getElementById("reset").addEventListener("click", () => {
        historie = [];
        statistika = [0, 0, 0, 0, 0, 0];
        soucetEl.textContent = "";
        vykresli();
    });

    tlacitko.addEventListener("click", hodKostkou);

    autoBtn.addEventListener("click", () => {
        autoZapnuto = !autoZapnuto;
        autoBtn.classList.toggle("zap", autoZapnuto);
        document.getElementById("autoText").textContent = autoZapnuto ? "Auto: zapnuto" : "Auto: vypnuto";
        if (autoZapnuto) {
            if (!tlacitko.disabled) hodKostkou();   // rozjede se hned; při probíhajícím hodu naváže sám
        } else {
            clearTimeout(autoCasovac);
        }
    });

    zobrazKostky([0]);
    vykresli();
</script>

</body>
</html>
